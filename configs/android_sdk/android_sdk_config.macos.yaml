sdk_root: ${workspace}/android

dependencies:
  - ${configs}/jdk/jdk_config.macos.yaml

variables:
  android_cmdline_tools_bootstrap_build: "13114758"
  android_ndk_version: "29.0.13599879"
  android_build_tools_version: "36.0.0-rc5"
  android_cmdline_tools_version: "19.0"

install:
  # android_sdk_bootstrap:
  - download:
      src:
        url: https://dl.google.com/android/repository/commandlinetools-mac-$var{android_cmdline_tools_bootstrap_build}_latest.zip
        SHA-256: 5673201e6f3869f418eeed3b5cb6c4be7401502bd0aae1b12a29d164d647a54e
      dest: ${download}/commandlinetools-mac-$var{android_cmdline_tools_bootstrap_build}_latest.zip
  - unzip:
      src: ${download}/commandlinetools-mac-$var{android_cmdline_tools_bootstrap_build}_latest.zip
      src_sub_folder: cmdline-tools
      dest: ${workspace}/android/android_sdk/cmdline-tools/bootstrap
  - make_execute_permission:
      files:
        - ${workspace}/android/android_sdk/cmdline-tools/bootstrap/bin
  # android_sdk_license:
  - execute:
      command:
        - . "${workspace}/jdk/active.sh" >/dev/null &&
        - 'yes |'
        - ${workspace}/android/android_sdk/cmdline-tools/bootstrap/bin/sdkmanager
        - --sdk_root=${workspace}/android/android_sdk
        - --licenses
        - ''
  # android_sdk:
  - execute:
      terminal: true
      command:
        - . "${workspace}/jdk/active.sh" >/dev/null &&
        - ${workspace}/android/android_sdk/cmdline-tools/bootstrap/bin/sdkmanager
        - --sdk_root=${workspace}/android/android_sdk
        - --install
        - '"ndk;$var{android_ndk_version}"'
        - '"build-tools;$var{android_build_tools_version}"'
        - '"ndk-bundle"'
        - '"platform-tools"'
        - '"cmdline-tools;$var{android_cmdline_tools_version}"'
generator_active_batch:
  file_path: ${workspace}/android/active.sh
  environments:
    set:
      ANDROID_SDK_ROOT: ${workspace}/android/android_sdk
      ANDROID_HOME: ${workspace}/android/android_sdk
      ANDROID_USER_HOME: ${workspace}/android/.android
    prepend:
      - PATH: ${workspace}/android/android_sdk/cmdline-tools/bin
      - PATH: ${workspace}/android/android_sdk/platform-tools
