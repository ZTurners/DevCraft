install:
  # cmake-3.31:
  - download:
      src:
        url: https://github.com/Kitware/CMake/releases/download/v4.2.3/cmake-4.2.3-macos10.10-universal.tar.gz
        SHA-256: 910b965a6fc72928412dd369c957643ff17a0990cc2435a2573b04c1352d9ff3
      dest: ${download}/cmake-4.2.3-macos-universal.tar.gz
  - unzip:
      src: ${download}/cmake-4.2.3-macos-universal.tar.gz
      src_sub_folder: cmake-4.2.3-macos-universal
      dest: ${workspace}/cmake/cmake-4.2.3-macos-universal
  - make_execute_permission:
      files:
        - ${workspace}/cmake/cmake-4.2.3-macos-universal/CMake.app/Contents/bin/cmake

generator_active_batch:
  file_path: ${workspace}/cmake/active.sh
  environments:
    set: {}
    prepend:
      - PATH: ${workspace}/cmake/cmake-4.2.3-macos-universal/CMake.app/Contents/bin
