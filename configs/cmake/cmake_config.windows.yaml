sdk_root: ${workspace}/cmake

variables:
  cmake_version: "4.2.3"

install:
  #cmake-3.31:
  - download:
      src:
        url: https://github.com/Kitware/CMake/releases/download/v$var{cmake_version}/cmake-$var{cmake_version}-windows-x86_64.zip
        SHA-256: eb4ebf5155dbb05436d675706b2a08189430df58904257ae5e91bcba4c86933c
      dest: ${download}/cmake-$var{cmake_version}-windows-x86_64.zip
  - unzip:
      src: ${download}/cmake-$var{cmake_version}-windows-x86_64.zip
      src_sub_folder: cmake-$var{cmake_version}-windows-x86_64
      dest: ${workspace}/cmake/cmake-$var{cmake_version}
generator_active_batch:
  file_path: ${workspace}/cmake/active.bat
  environments:
    set: {}
    prepend:
      - PATH: ${workspace}/cmake/cmake-$var{cmake_version}/bin
