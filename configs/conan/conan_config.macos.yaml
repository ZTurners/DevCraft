sdk_root: ${workspace}/conan

install:
  # conan_install:
  - execute:
      command:
        - python -m pip install conan
  # conan_boostrap:
  - copy:
      src: ${configs}/conan/home
      dest: ${workspace}/conan/.conan
      force_update: true
  # conan_profile_detect:
  - environments:
      set:
        CONAN_HOME: ${workspace}/conan/.conan
        CONAN_USE_ALWAYS_SHORT_PATHS: '1'
      prepend: []
  - execute:
      command:
        - conan profile detect --force
