sdk_root: ${workspace}/conan

# the wipe on reinstalls skips these paths, so .conan (profiles,
# remotes, login) survives config changes and version bumps while old
# conan-<version> dirs are still cleaned up
preserve_on_reinstall:
  - ${workspace}/conan/.conan

variables:
  conan_version: "2.33.0"

install:
  # standalone self-contained conan (PyInstaller bundle with its own python
  # runtime) — fully decoupled from the workspace python config
  - download:
      src:
        url: https://github.com/conan-io/conan/releases/download/$var{conan_version}/conan-$var{conan_version}-macos-arm64.tgz
        SHA-256: f93092efecd504108b5b9571387663c9149367eb0f52f324206d4f7105cc919a
      dest: ${download}/conan-$var{conan_version}-macos-arm64.tgz
  - unzip:
      src: ${download}/conan-$var{conan_version}-macos-arm64.tgz
      dest: ${workspace}/conan/conan-$var{conan_version}
  # conan_boostrap:
  - copy:
      src: ${configs}/conan/home
      dest: ${workspace}/conan/.conan
      force_update: true
  # conan_profile_detect:
  - environments:
      set:
        CONAN_HOME: ${workspace}/conan/.conan
        CONAN_USE_ALWAYS_SHORT_PATHS: '1'
      prepend: []
  - execute:
      command:
        - ${workspace}/conan/conan-$var{conan_version}/bin/conan profile detect --force
  # install conanfile:
  # - execute:
  #     command:
  #       - conan
  #       - install
  #       - ${configs}/conan/profiles/conanfile.txt
  #       - --update
  #       - --generator
  #       - CMakeToolchain
  #       - --generator
  #       - VirtualBuildEnv
  #       - --output-folder
  #       - ${workspace}/conan
  #       - --build
  #       - never
  #       - --profile
  #       - ${configs}/conan/profiles/builder/conan_builder_profile.macos.txt
generator_active_batch:
  file_path: ${workspace}/conan/active.sh
  environments:
    set:
      CONAN_HOME: ${workspace}/conan/.conan
      CONAN_USE_ALWAYS_SHORT_PATHS: '1'
    prepend:
      - PATH: ${workspace}/conan/conan-$var{conan_version}/bin
