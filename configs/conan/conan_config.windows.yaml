sdk_root: ${workspace}/conan

# the wipe on reinstalls skips these paths, so .conan (profiles,
# remotes, login) survives config changes and version bumps while old
# conan-<version> dirs are still cleaned up
preserve_on_reinstall:
  - ${workspace}/conan/.conan

variables:
  conan_version: "2.33.0"

install:
  # standalone self-contained conan (PyInstaller bundle with its own python
  # runtime) — fully decoupled from the workspace python config
  - download:
      src:
        url: https://github.com/conan-io/conan/releases/download/$var{conan_version}/conan-$var{conan_version}-windows-x86_64.zip
        SHA-256: 39aa6b6d1bf8d92cb40e0f9afcaa7ad7a7467e729c6f8e76cf621f140516d2c5
      dest: ${download}/conan-$var{conan_version}-windows-x86_64.zip
  - unzip:
      src: ${download}/conan-$var{conan_version}-windows-x86_64.zip
      dest: ${workspace}/conan/conan-$var{conan_version}
  # conan_boostrap:
  - copy:
      src: ${configs}/conan/home
      dest: ${workspace}/conan/.conan
      force_update: true
  # conan_profile_detect:
  - environments:
      set:
        CONAN_HOME: ${workspace}/conan/.conan
        CONAN_USE_ALWAYS_SHORT_PATHS: '1'
      prepend: []
  - execute:
      command:
        - ${workspace}/conan/conan-$var{conan_version}/conan.exe profile detect --force

generator_active_batch:
  file_path: ${workspace}/conan/active.bat
  environments:
    set:
      CONAN_HOME: ${workspace}/conan/.conan
      CONAN_USE_ALWAYS_SHORT_PATHS: '1'
    prepend:
      - PATH: ${workspace}/conan/conan-$var{conan_version}
