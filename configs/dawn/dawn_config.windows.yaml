sdk_root: ${workspace}/dawn

variables:
  # Quoted: an unquoted value like 20260423.175430 parses as a YAML float and
  # loses the trailing zero.
  dawn_version: "20260423.175430"
  dawn_commit: "31e25af254ab572c77054edec4946d2244e184dd"

install:
  # Download Dawn pre-compiled release for Windows (Release build).
  - download:
      src:
        url: https://github.com/google/dawn/releases/download/v$var{dawn_version}/Dawn-$var{dawn_commit}-windows-latest-Release.tar.gz
      dest: ${download}/Dawn-$var{dawn_commit}-windows-latest-Release.tar.gz
  - unzip:
      src: ${download}/Dawn-$var{dawn_commit}-windows-latest-Release.tar.gz
      src_sub_folder: Dawn-$var{dawn_commit}-windows-latest-Release
      dest: ${workspace}/dawn/v$var{dawn_version}

generator_active_batch:
  file_path: ${workspace}/dawn/active.bat
  environments:
    set:
      DAWN_ROOT: ${workspace}/dawn/v$var{dawn_version}
      DAWN_CMAKE_DIR: ${workspace}/dawn/v$var{dawn_version}/lib/cmake/Dawn
    prepend:
      - PATH: ${workspace}/dawn/v$var{dawn_version}/bin
