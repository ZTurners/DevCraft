install:
  # Download Dawn pre-compiled release for Windows (Release build).
  - download:
      src:
        url: https://github.com/google/dawn/releases/download/v20260423.175430/Dawn-31e25af254ab572c77054edec4946d2244e184dd-windows-latest-Release.tar.gz
      dest: ${download}/Dawn-31e25af254ab572c77054edec4946d2244e184dd-windows-latest-Release.tar.gz
  - unzip:
      src: ${download}/Dawn-31e25af254ab572c77054edec4946d2244e184dd-windows-latest-Release.tar.gz
      src_sub_folder: Dawn-31e25af254ab572c77054edec4946d2244e184dd-windows-latest-Release
      dest: ${workspace}/dawn/v20260423.175430

generator_active_batch:
  file_path: ${workspace}/dawn/active.bat
  environments:
    set:
      DAWN_ROOT: ${workspace}/dawn/v20260423.175430
      DAWN_CMAKE_DIR: ${workspace}/dawn/v20260423.175430/lib/cmake/Dawn
    prepend:
      - PATH: ${workspace}/dawn/v20260423.175430/bin
