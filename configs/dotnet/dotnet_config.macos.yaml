sdk_root: ${workspace}/dotnet

variables:
  dotnet_version: "10.0.401"

install:
  - download:
      src:
        url: https://builds.dotnet.microsoft.com/dotnet/Sdk/$var{dotnet_version}/dotnet-sdk-$var{dotnet_version}-osx-arm64.tar.gz
        SHA-512: 69f64eb00dc045398755c440b152225d544301a345a146a16e86a56a0c52b7c94b2c331520e976dbb821f18d31930aafbd25bb85961e3517e0665414ce0cbcff
      dest: ${download}/dotnet-sdk-$var{dotnet_version}-osx-arm64.tar.gz
  - unzip:
      src: ${download}/dotnet-sdk-$var{dotnet_version}-osx-arm64.tar.gz
      src_sub_folder: ""
      dest: ${workspace}/dotnet/dotnet-sdk-$var{dotnet_version}-osx-arm64

  - environments:
      set:
        NUGET_PACKAGES: ${workspace}/nuget

  # NuGet sources: checked-in NuGet.config copied into the workspace
  # (conan-home style) and passed to the workload install via --configfile;
  # it prefers the Huawei Cloud nuget.org mirror, with nuget.org as fallback
  - copy:
      src: ${configs}/dotnet/NuGet.config
      dest: ${workspace}/dotnet/NuGet.config
      force_update: true

  - execute:
      terminal: true
      command:
        - ${workspace}/dotnet/dotnet-sdk-$var{dotnet_version}-osx-arm64/dotnet workload install wasi-experimental wasm-tools --verbosity detailed --configfile ${workspace}/dotnet/NuGet.config

generator_active_batch:
  file_path: ${workspace}/dotnet/active.sh
  environments:
    set:
      DOTNET_ROOT: ${workspace}/dotnet/dotnet-sdk-$var{dotnet_version}-osx-arm64
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_CLI_UI_LANGUAGE: en-US
      NUGET_PACKAGES: ${workspace}/nuget
    prepend:
      - PATH: ${workspace}/dotnet/dotnet-sdk-$var{dotnet_version}-osx-arm64/bin
      - PATH: ${workspace}/dotnet/dotnet-sdk-$var{dotnet_version}-osx-arm64
