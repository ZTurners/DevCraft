sdk_root: ${workspace}/dotnet

variables:
  dotnet_version: "10.0.401"

install:
  - download:
      src:
        url: https://builds.dotnet.microsoft.com/dotnet/Sdk/$var{dotnet_version}/dotnet-sdk-$var{dotnet_version}-win-x64.zip
        SHA-512: 24b670ad3d923bfcf47df6c3b034152398b42f6dbc388e10d783aee1cfb5e5817d399fc0ae2a12cfa822a55e61d34830ccb15c50ef6efee437ab874bb7c79430
      dest: ${download}/dotnet-sdk-$var{dotnet_version}-win-x64.zip
  - unzip:
      src: ${download}/dotnet-sdk-$var{dotnet_version}-win-x64.zip
      src_sub_folder: ""
      dest: ${workspace}/dotnet/dotnet-sdk-$var{dotnet_version}-win-x64

  - environments:
      set:
        NUGET_PACKAGES: ${workspace}/nuget

  # install extra workloads
  - execute:
      terminal: true
      command:
        - ${workspace}/dotnet/dotnet-sdk-$var{dotnet_version}-win-x64/dotnet.exe workload install wasi-experimental wasm-tools

generator_active_batch:
  file_path: ${workspace}/dotnet/active.bat
  environments:
    set:
      DOTNET_ROOT: ${workspace}/dotnet/dotnet-sdk-$var{dotnet_version}-win-x64
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_CLI_UI_LANGUAGE: en-US
      NUGET_PACKAGES: ${workspace}/nuget
    prepend:
      - PATH: ${workspace}/dotnet/dotnet-sdk-$var{dotnet_version}-win-x64
