sdk_root: ${workspace}/electron

variables:
  electron_version: "44.9.1"

install:
  - download:
      src:
        url: https://github.com/electron/electron/releases/download/v$var{electron_version}/electron-v$var{electron_version}-win32-x64.zip
        SHA-256: 41bd7900bd42d0f49110a81617876137041fbbf473466920248ddb076349ef91
      dest: ${download}/electron-v$var{electron_version}-win32-x64.zip
  - unzip:
      src: ${download}/electron-v$var{electron_version}-win32-x64.zip
      dest: ${workspace}/electron/electron-v$var{electron_version}

generator_active_batch:
  file_path: ${workspace}/electron/active.bat
  environments:
    set:
      ELECTRON_HOME: ${workspace}/electron/electron-v$var{electron_version}
      ELECTRON_EXECUTABLE: ${workspace}/electron/electron-v$var{electron_version}/electron.exe
    prepend:
      - PATH: ${workspace}/electron/electron-v$var{electron_version}
