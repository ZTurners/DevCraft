install:
  # emscripten sdk
  - download:
      src:
        url: https://github.com/emscripten-core/emsdk/archive/refs/tags/3.1.73.tar.gz
      dest: ${download}/emsdk-3.1.73.tar.gz
  - unzip:
      src: ${download}/emsdk-3.1.73.tar.gz
      src_sub_folder: emsdk-3.1.73
      dest: ${workspace}/emscripten/emsdk-3.1.73

  # make emsdk executable
  - make_execute_permission:
      files:
        - ${workspace}/emscripten/emsdk-3.1.73/emsdk
        - ${workspace}/emscripten/emsdk-3.1.73/emsdk_env.sh

  # install and activate latest emscripten toolchain
  - execute:
      command:
        - ${workspace}/emscripten/emsdk-3.1.73/emsdk
        - install
        - latest
  - execute:
      command:
        - ${workspace}/emscripten/emsdk-3.1.73/emsdk
        - activate
        - latest

generator_active_batch:
  file_path: ${workspace}/emscripten/active
  environments:
    set:
      EMSDK: ${workspace}/emscripten/emsdk-3.1.73
      EM_CONFIG: ${workspace}/emscripten/emsdk-3.1.73/.emscripten
      EMSDK_PYTHON: ${workspace}/emscripten/emsdk-3.1.73/python/3.9.2_64bit/bin/python3
      EMSDK_NODE: ${workspace}/emscripten/emsdk-3.1.73/node/20.18.0_arm64/bin/node
    prepend:
      - PATH: ${workspace}/emscripten/emsdk-3.1.73
      - PATH: ${workspace}/emscripten/emsdk-3.1.73/upstream/emscripten
      - PATH: ${workspace}/emscripten/emsdk-3.1.73/python/3.9.2_64bit/bin
      - PATH: ${workspace}/emscripten/emsdk-3.1.73/node/20.18.0_arm64/bin
