install:
  # emscripten sdk
  - download:
      src:
        url: https://github.com/emscripten-core/emsdk/archive/refs/tags/3.1.73.zip
      dest: ${download}/emsdk-3.1.73.zip
  - unzip:
      src: ${download}/emsdk-3.1.73.zip
      src_sub_folder: emsdk-3.1.73
      dest: ${workspace}/emscripten/emsdk-3.1.73

  # install and activate latest emscripten toolchain
  - execute:
      command:
        - ${workspace}/emscripten/emsdk-3.1.73/emsdk.bat
        - install
        - latest
  - execute:
      skip_if_exists: ${workspace}/emscripten/emsdk-3.1.73/upstream/emscripten/node_modules/typescript/bin/tsc
      command:
        - pushd "${workspace}/emscripten/emsdk-3.1.73/upstream/emscripten" && "${workspace}/emscripten/emsdk-3.1.73/node/20.18.0_64bit/bin/npm.cmd" install && popd
  - execute:
      command:
        - ${workspace}/emscripten/emsdk-3.1.73/emsdk.bat
        - activate
        - latest

generator_active_batch:
  file_path: ${workspace}/emscripten/active
  environments:
    set:
      EMSDK: ${workspace}/emscripten/emsdk-3.1.73
      EM_CONFIG: ${workspace}/emscripten/emsdk-3.1.73/.emscripten
      EMSDK_PYTHON: ${workspace}/emscripten/emsdk-3.1.73/python/3.9.2-nuget_64bit/python.exe
      EMSDK_NODE: ${workspace}/emscripten/emsdk-3.1.73/node/20.18.0_64bit/bin/node.exe
    prepend:
      - PATH: ${workspace}/emscripten/emsdk-3.1.73
      - PATH: ${workspace}/emscripten/emsdk-3.1.73/upstream/emscripten
      - PATH: ${workspace}/emscripten/emsdk-3.1.73/python/3.9.2-nuget_64bit
      - PATH: ${workspace}/emscripten/emsdk-3.1.73/node/20.18.0_64bit/bin
