install:
  # emscripten sdk
  - download:
      src:
        url: https://github.com/emscripten-core/emsdk/archive/refs/tags/5.0.5.zip
      dest: ${download}/emsdk-5.0.5.zip
  - unzip:
      src: ${download}/emsdk-5.0.5.zip
      src_sub_folder: emsdk-5.0.5
      dest: ${workspace}/emscripten/emsdk-5.0.5

  # install and activate the pinned emscripten toolchain
  - execute:
      command:
        - ${workspace}/emscripten/emsdk-5.0.5/emsdk.bat
        - install
        - 5.0.5
  - execute:
      skip_if_exists: ${workspace}/emscripten/emsdk-5.0.5/upstream/emscripten/node_modules/typescript/bin/tsc
      command:
        - pushd "${workspace}/emscripten/emsdk-5.0.5/upstream/emscripten" && "${workspace}/emscripten/emsdk-5.0.5/node/22.16.0_64bit/bin/npm.cmd" install && popd
  - execute:
      command:
        - ${workspace}/emscripten/emsdk-5.0.5/emsdk.bat
        - activate
        - 5.0.5

generator_active_batch:
  file_path: ${workspace}/emscripten/active.bat
  environments:
    set:
      EMSDK: ${workspace}/emscripten/emsdk-5.0.5
      EM_CONFIG: ${workspace}/emscripten/emsdk-5.0.5/.emscripten
      EMSDK_PYTHON: ${workspace}/emscripten/emsdk-5.0.5/python/3.13.3_64bit/python.exe
      EMSDK_NODE: ${workspace}/emscripten/emsdk-5.0.5/node/22.16.0_64bit/bin/node.exe
    prepend:
      - PATH: ${workspace}/emscripten/emsdk-5.0.5
      - PATH: ${workspace}/emscripten/emsdk-5.0.5/upstream/emscripten
      - PATH: ${workspace}/emscripten/emsdk-5.0.5/python/3.13.3_64bit
      - PATH: ${workspace}/emscripten/emsdk-5.0.5/node/22.16.0_64bit/bin
