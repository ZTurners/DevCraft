install:
  # gradle-9.1.0:
  - download:
      src:
        url: https://services.gradle.org/distributions/gradle-9.1.0-bin.zip
        SHA-256: a17ddd85a26b6a7f5ddb71ff8b05fc5104c0202c6e64782429790c933686c806
      dest: ${download}/gradle-9.1.0-bin.zip
  - unzip:
      src: ${download}/gradle-9.1.0-bin.zip
      src_sub_folder: gradle-9.1.0
      dest: ${workspace}/gradle/gradle-9.1.0
  - make_execute_permission:
      files:
        - ${workspace}/gradle/gradle-9.1.0/bin/gradle
generator_active_batch:
  file_path: ${workspace}/gradle/active.sh
  environments:
    set:
      GRADLE_USER_HOME: ${workspace}/gradle/gradle-9.1.0/.gradle
    prepend:
    - PATH: ${workspace}/gradle/gradle-9.1.0/bin
