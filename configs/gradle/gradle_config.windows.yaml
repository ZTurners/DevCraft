sdk_root: ${workspace}/gradle

variables:
  gradle_version: "9.1.0"

install:
  # gradle-9.1.0:
  - download:
      src:
        url: https://services.gradle.org/distributions/gradle-$var{gradle_version}-bin.zip
        SHA-256: a17ddd85a26b6a7f5ddb71ff8b05fc5104c0202c6e64782429790c933686c806
      dest: ${download}/gradle-$var{gradle_version}-bin.zip
  - unzip:
      src: ${download}/gradle-$var{gradle_version}-bin.zip
      src_sub_folder: gradle-$var{gradle_version}
      dest: ${workspace}/gradle/gradle-$var{gradle_version}
generator_active_batch:
  file_path: ${workspace}/gradle/active.bat
  environments:
    set:
      GRADLE_USER_HOME: ${workspace}/gradle/gradle-$var{gradle_version}/.gradle
    prepend:
    - PATH: ${workspace}/gradle/gradle-$var{gradle_version}/bin
