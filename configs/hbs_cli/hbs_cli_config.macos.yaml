dependencies:
  - emscripten

install:
  - execute:
      command:
        - env
        - PATH=${workspace}/emscripten/emsdk-5.0.5/node/22.16.0_64bit/bin:/usr/bin:/bin
        - ${workspace}/emscripten/emsdk-5.0.5/node/22.16.0_64bit/bin/node
        - ${workspace}/emscripten/emsdk-5.0.5/node/22.16.0_64bit/lib/node_modules/npm/bin/npm-cli.js
        - install
        - -g
        - hbs-cli
        - handlebars
        
generator_active_batch:
  file_path: ${workspace}/hbs_cli/active.sh
  environments:
    prepend:
      - PATH: ${workspace}/emscripten/emsdk-5.0.5/node/22.16.0_64bit/bin
