dependencies:
  - emscripten

install:
  - execute:
      command:
        - ${workspace}/emscripten/emsdk-5.0.5/node/22.16.0_64bit/bin/npm
        - install
        - -g
        - hbs-cli
        - handlebars
        
generator_active_batch:
  file_path: ${workspace}/hbs_cli/active.sh
  environments:
    prepend:
      - PATH: ${workspace}/emscripten/emsdk-5.0.5/node/22.16.0_64bit/bin