sdk_root: ${workspace}/hbs_cli

dependencies:
  - nodejs

install:
  - execute:
      command:
        - '"${NODE_HOME}/bin/node"'
        - '"${NODE_HOME}/lib/node_modules/npm/bin/npm-cli.js"'
        - install
        - -g
        - hbs-cli
        - handlebars

generator_active_batch:
  file_path: ${workspace}/hbs_cli/active.sh
  environments: {}
