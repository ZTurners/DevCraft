sdk_root: ${workspace}/hbs_cli

dependencies:
  - nodejs

install:
  - execute:
      command:
        - ${workspace}/nodejs/node-v$var{node_version}/bin/node
        - ${workspace}/nodejs/node-v$var{node_version}/lib/node_modules/npm/bin/npm-cli.js
        - install
        - -g
        - hbs-cli
        - handlebars

generator_active_batch:
  file_path: ${workspace}/hbs_cli/active.sh
  environments:
    prepend:
      - PATH: ${workspace}/nodejs/node-v$var{node_version}/bin
