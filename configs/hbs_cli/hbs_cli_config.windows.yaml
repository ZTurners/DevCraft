sdk_root: ${workspace}/hbs_cli

dependencies:
  - nodejs
  - mustache

install:
  - execute:
      command:
        - '"%NODE_HOME%/npm.cmd"'
        - install
        - -g
        - hbs-cli
        - handlebars

generator_active_batch:
  file_path: ${workspace}/hbs_cli/active.bat
  environments: {}
