dependencies:
  - emscripten

install:
  - execute:
      command:
        - ${workspace}/emscripten/emsdk-5.0.5/node/22.16.0_64bit/bin/npm.cmd
        - install
        - -g
        - hbs-cli

generator_active_batch:
  file_path: ${workspace}/hbs_cli/active.bat
  environments:
    prepend:
      - PATH: ${workspace}/emscripten/emsdk-5.0.5/node/22.16.0_64bit/bin;${workspace}/mustache/mustache_1.4.0_win_x86_64
