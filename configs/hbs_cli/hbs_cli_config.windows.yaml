sdk_root: ${workspace}/hbs_cli

dependencies:
  - nodejs
  - mustache

install:
  - execute:
      command:
        - ${workspace}/nodejs/node-v$var{node_version}/npm.cmd
        - install
        - -g
        - hbs-cli
        - handlebars

generator_active_batch:
  file_path: ${workspace}/hbs_cli/active.bat
  environments:
    prepend:
      - PATH: ${workspace}/nodejs/node-v$var{node_version};${workspace}/mustache/mustache_$var{mustache_version}_windows_amd64
