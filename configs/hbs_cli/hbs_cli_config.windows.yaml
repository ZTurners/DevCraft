dependencies:
  - nodejs

install:
  - execute:
      command:
        - ${workspace}/nodejs/node-v26.8.1/npm.cmd
        - install
        - -g
        - hbs-cli
        - handlebars

generator_active_batch:
  file_path: ${workspace}/hbs_cli/active.bat
  environments:
    prepend:
      - PATH: ${workspace}/nodejs/node-v26.8.1;${workspace}/mustache/mustache_1.4.0_win_x86_64
