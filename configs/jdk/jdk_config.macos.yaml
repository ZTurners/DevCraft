sdk_root: ${workspace}/jdk

variables:
  jdk_version: "25.0.1"
  jdk_major: "25"

install:
  # jdk-25:
  - download:
      src:
        url: https://download.oracle.com/java/$var{jdk_major}/archive/jdk-$var{jdk_version}_macos-aarch64_bin.tar.gz
        SHA-256: c8866e94cb34f1b7179257ceb8db8b53f26685e7d70644b17304f09fd8f93cc2
      dest: ${download}/jdk-$var{jdk_major}_macos-aarch64_bin.tar.gz
  - unzip:
      src: ${download}/jdk-$var{jdk_major}_macos-aarch64_bin.tar.gz
      src_sub_folder: ./jdk-$var{jdk_version}.jdk/Contents/Home
      dest: ${workspace}/jdk/jdk-$var{jdk_major}
generator_active_batch:
  file_path: ${workspace}/jdk/active.sh
  environments:
    set:
      JAVA_HOME: ${workspace}/jdk/jdk-$var{jdk_major}
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8
    prepend:
    - PATH: ${workspace}/jdk/jdk-$var{jdk_major}/bin
