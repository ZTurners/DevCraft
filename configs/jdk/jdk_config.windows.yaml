sdk_root: ${workspace}/jdk

variables:
  jdk_version: "25.0.1"
  jdk_major: "25"

install:
  # jdk-25:
  - download:
      src:
        url: https://download.oracle.com/java/$var{jdk_major}/archive/jdk-$var{jdk_version}_windows-x64_bin.zip
        SHA-256: 814530b8ae9aca4843b6f70cf14dac1d43a88e220847d3b91323e854d79cee88
      dest: ${download}/jdk-$var{jdk_version}_windows-x64_bin.zip
  - unzip:
      src: ${download}/jdk-$var{jdk_version}_windows-x64_bin.zip
      src_sub_folder: jdk-$var{jdk_version}
      dest: ${workspace}/jdk/jdk-$var{jdk_major}
generator_active_batch:
  file_path: ${workspace}/jdk/active.bat
  environments:
    set:
      JAVA_HOME: ${workspace}/jdk/jdk-$var{jdk_major}
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8
    prepend:
      - PATH: ${workspace}/jdk/jdk-$var{jdk_major}/bin
