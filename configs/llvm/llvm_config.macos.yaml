sdk_root: ${workspace}/llvm

variables:
  llvm_version: "23.1.1"
  llvm_major: "23"

install:
  - execute:
      terminal: true
      command:
        - if brew list --versions llvm >/dev/null 2>&1; then brew upgrade llvm; else brew install llvm; fi &&
        - mkdir -p ${workspace}/llvm/llvm-$var{llvm_major} &&
        - ln -sf $(brew --prefix llvm) ${workspace}/llvm/llvm-$var{llvm_major}/arm64-apple-darwin
  # Keep LLD on the current stable release because newer Apple SDK TAPI
  # targets (for example arm64e.x1-macos) are not supported by ld64.lld 21.
  - execute:
      terminal: true
      command:
        - if brew list --versions lld >/dev/null 2>&1; then brew upgrade lld; else brew install lld; fi &&
        - mkdir -p ${workspace}/llvm/lld-$var{llvm_major} &&
        - ln -sf $(brew --prefix lld) ${workspace}/llvm/lld-$var{llvm_major}/arm64-apple-darwin

  # llvm for macos arm64
  # - download:
  #     src:
  #       url: https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.1/LLVM-23.1.1-macOS-ARM64.tar.xz
  #       SHA-256: 64220f1c99132ef7e580447781b84f96fbba6862a43a8f6522b423052cd67502
  #     dest: ${download}/LLVM-23.1.1-macOS-ARM64.tar.xz
  # - unzip:
  #     src: ${download}/LLVM-23.1.1-macOS-ARM64.tar.xz
  #     src_sub_folder: LLVM-23.1.1-macOS-ARM64
  #     dest: ${workspace}/llvm/llvm-23/arm64-apple-darwin

  # llvm for linux arm64
  - download:
      src:
        url: https://github.com/llvm/llvm-project/releases/download/llvmorg-$var{llvm_version}/LLVM-$var{llvm_version}-Linux-ARM64.tar.xz
        SHA-256: 3fbaaa6a1f147557a4095b9911f8dc2d4c745a11863982f76ee20e248c190a80
      dest: ${download}/LLVM-$var{llvm_version}-Linux-ARM64.tar.xz
  - unzip:
      src: ${download}/LLVM-$var{llvm_version}-Linux-ARM64.tar.xz
      src_sub_folder: LLVM-$var{llvm_version}-Linux-ARM64
      dest: ${workspace}/llvm/llvm-$var{llvm_major}/aarch64-linux-gnu

  # llvm for linux x86_64
  - download:
      src:
        url: https://github.com/llvm/llvm-project/releases/download/llvmorg-$var{llvm_version}/LLVM-$var{llvm_version}-Linux-X64.tar.xz
        SHA-256: 832aeb58d105de1cabc7b982dd2c65de0610f7377df48ae8fc2dd8e97420a15c
      dest: ${download}/LLVM-$var{llvm_version}-Linux-X64.tar.xz
  - unzip:
      src: ${download}/LLVM-$var{llvm_version}-Linux-X64.tar.xz
      src_sub_folder: LLVM-$var{llvm_version}-Linux-X64
      dest: ${workspace}/llvm/llvm-$var{llvm_major}/x86_64-linux-gnu
generator_active_batch:
  file_path: ${workspace}/llvm/active.sh
  environments:
    # set:
    #   HOST_LLVM_BIN: ${workspace}/llvm/llvm-23/arm64-apple-darwin/bin
    prepend:
      - PATH: ${workspace}/llvm/llvm-$var{llvm_major}/arm64-apple-darwin/bin
      - PATH: ${workspace}/llvm/lld-$var{llvm_major}/arm64-apple-darwin/bin
