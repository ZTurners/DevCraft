install:
  - download:
      src:
        url: https://github.com/cbroglie/mustache/releases/download/v1.4.0/mustache_1.4.0_windows_amd64.tar.gz
      dest: ${download}/mustache_1.4.0_windows_amd64.tar.gz
  - unzip:
      src: ${download}/mustache_1.4.0_windows_amd64.tar.gz
      src_sub_folder: ""
      dest: ${workspace}/mustache/mustache_1.4.0_windows_amd64
generator_active_batch:
  file_path: ${workspace}/mustache/active.bat
  environments:
    prepend:
      - PATH: ${workspace}/mustache/mustache_1.4.0_windows_amd64
