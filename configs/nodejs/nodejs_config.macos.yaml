sdk_root: ${workspace}/nodejs

variables:
  node_version: "26.8.1"

install:
  # Node.js v26.8.1 (latest stable release at configuration time)
  - download:
      src:
        url: https://nodejs.org/dist/v$var{node_version}/node-v$var{node_version}-darwin-arm64.tar.gz
        SHA-256: 6e577fd0d9db776db82306629e441a9dace416702622aebdd171c9dfaa41f4d2
      dest: ${download}/node-v$var{node_version}-darwin-arm64.tar.gz
  - unzip:
      src: ${download}/node-v$var{node_version}-darwin-arm64.tar.gz
      src_sub_folder: node-v$var{node_version}-darwin-arm64
      dest: ${workspace}/nodejs/node-v$var{node_version}

generator_active_batch:
  file_path: ${workspace}/nodejs/active.sh
  environments:
    set:
      NODE_HOME: ${workspace}/nodejs/node-v$var{node_version}
      NPM_CONFIG_PREFIX: ${workspace}/nodejs/global
    prepend:
      - PATH: ${workspace}/nodejs/node-v$var{node_version}/bin
      - PATH: ${workspace}/nodejs/global/bin
