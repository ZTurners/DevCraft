sdk_root: ${workspace}/nodejs

variables:
  node_version: "26.8.1"

install:
  # Node.js v26.8.1 (latest stable release at configuration time)
  - download:
      src:
        url: https://nodejs.org/dist/v$var{node_version}/node-v$var{node_version}-win-x64.zip
        SHA-256: 57693d8e93d1b04e7b7de46aca53ecd63e97564e73de36a68428d7ff08d83587
      dest: ${download}/node-v$var{node_version}-win-x64.zip
  - unzip:
      src: ${download}/node-v$var{node_version}-win-x64.zip
      src_sub_folder: node-v$var{node_version}-win-x64
      dest: ${workspace}/nodejs/node-v$var{node_version}

generator_active_batch:
  file_path: ${workspace}/nodejs/active.bat
  environments:
    set:
      NODE_HOME: ${workspace}/nodejs/node-v$var{node_version}
      NPM_CONFIG_PREFIX: ${workspace}/nodejs/global
    prepend:
      - PATH: ${workspace}/nodejs/node-v$var{node_version}
      - PATH: ${workspace}/nodejs/global
