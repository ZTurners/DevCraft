sdk_root: ${workspace}/pnpm

dependencies:
  - nodejs

install:
  - execute:
      # skip_if_exists: ${workspace}/pnpm/bin/pnpm
      command:
        - '"${NODE_HOME}/bin/node"'
        - '"${NODE_HOME}/lib/node_modules/npm/bin/npm-cli.js"'
        - install
        - --global
        - --prefix
        - ${workspace}/pnpm
        - pnpm

generator_active_batch:
  file_path: ${workspace}/pnpm/active.sh
  # commands:
  #   - pnpm setup
  environments:
    set:
      PNPM_HOME: ${workspace}/pnpm
    prepend:
      - PATH: ${workspace}/pnpm/bin
