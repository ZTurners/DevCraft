dependencies:
  - nodejs

install:
  - execute:
      # skip_if_exists: ${workspace}/pnpm/bin/pnpm
      command:
        - env
        - PATH=${workspace}/nodejs/node-v26.8.1/bin:/usr/bin:/bin
        - ${workspace}/nodejs/node-v26.8.1/bin/node
        - ${workspace}/nodejs/node-v26.8.1/lib/node_modules/npm/bin/npm-cli.js
        - install
        - --global
        - --prefix
        - ${workspace}/pnpm
        - pnpm

generator_active_batch:
  file_path: ${workspace}/pnpm/active.sh
  # commands:
  #   - pnpm setup
  environments:
    set:
      PNPM_HOME: ${workspace}/pnpm/global
    prepend:
      - PATH: ${workspace}/nodejs/node-v26.8.1/bin
      - PATH: ${workspace}/pnpm
      - PATH: ${workspace}/pnpm/bin
