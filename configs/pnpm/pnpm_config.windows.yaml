dependencies:
  - nodejs

install:
  - execute:
      # skip_if_exists: ${workspace}/pnpm/pnpm.cmd
      command:
        - ${workspace}/nodejs/node-v26.8.1/npm.cmd
        - install
        - --global
        - --prefix
        - ${workspace}/pnpm
        - pnpm

generator_active_batch:
  file_path: ${workspace}/pnpm/active.bat
  # commands:
  #   - pnpm setup
  environments:
    set:
      PNPM_HOME: ${workspace}/pnpm
    prepend:
      - PATH: ${workspace}/pnpm
