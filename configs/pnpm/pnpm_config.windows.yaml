sdk_root: ${workspace}/pnpm

dependencies:
  - nodejs

install:
  # put node.exe on PATH so pnpm's postinstall (cmd /c node install.js) can find it
  - environments:
      prepend:
        - PATH: ${workspace}/nodejs/node-v$var{node_version}

  - execute:
      # skip_if_exists: ${workspace}/pnpm/pnpm.cmd
      command:
        - ${workspace}/nodejs/node-v$var{node_version}/npm.cmd
        - install
        - --global
        - --prefix
        - ${workspace}/pnpm
        - pnpm

generator_active_batch:
  file_path: ${workspace}/pnpm/active.bat
  # commands:
  #   - pnpm setup
  environments:
    set:
      PNPM_HOME: ${workspace}/pnpm
    prepend:
      - PATH: ${workspace}/pnpm
