# No sdk_root on purpose: the install only pip-installs into the bootstrap
# python under ${workspace}/python, which is the interpreter install.py itself
# runs on. A sdk_root here would make a config change wipe the running
# interpreter (WinError 5 on the loaded exe/.pyd files).
variables:
  python_version: "3.13.5"

install:
  # install lib clang for python
  - execute:
      command:
        - ${workspace}/python/versions/$var{python_version}/bin/python -m pip install clang

generator_active_batch:
  file_path: ${workspace}/python/active.sh
  environments:
    set:
      PYTHON_HOME: ${workspace}/python/versions/$var{python_version}
    prepend:
      - PATH: ${workspace}/python/versions/$var{python_version}
      - PATH: ${workspace}/python/versions/$var{python_version}/bin
      - PATH: ${workspace}/python/versions/$var{python_version}/scripts
