sdk_root: ${workspace}/rust

install:
  # downloading-rustup-macos:
  - download:
      src:
        url: https://rsproxy.cn/rustup/dist/aarch64-apple-darwin/rustup-init
      dest: ${download}/rustup-init
  - copy:
      src: ${configs}/rustup/home/settings.toml
      dest: ${workspace}/rust/.rustup/settings.toml
  - copy:
      src: ${configs}/rustup/cargo/config.toml
      dest: ${workspace}/rust/.cargo/config.toml
  # install-rustup-macos:
  - copy:
      src: ${download}/rustup-init
      dest: ${workspace}/rust/rustup-init
  - environments:
      set:
        RUSTUP_HOME: ${workspace}/rust/.rustup
        CARGO_HOME: ${workspace}/rust/.cargo
        RUSTUP_DIST_SERVER: https://rsproxy.cn
        RUSTUP_UPDATE_ROOT: https://rsproxy.cn/rustup
  - make_execute_permission:
      files:
        - ${workspace}/rust/rustup-init
  - execute:
      terminal: true
      command:
      - ${workspace}/rust/rustup-init
      - -y
  - execute:
      command:
      - ${workspace}/rust/.cargo/bin/rustup
      - target
      - add
      - wasm32-wasip2
  - execute:
      terminal: true
      command:
      - ${workspace}/rust/.cargo/bin/cargo
      - install
      - wasm-tools
      - wit-bindgen-cli
      - cargo-component
generator_active_batch:
  file_path: ${workspace}/rust/active.sh
  environments:
    set:
      RUSTUP_HOME: ${workspace}/rust/.rustup
      CARGO_HOME: ${workspace}/rust/.cargo
    prepend:
      - PATH: ${workspace}/rust/.cargo/bin
