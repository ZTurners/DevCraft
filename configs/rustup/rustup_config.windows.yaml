sdk_root: ${workspace}/rust

dependencies:
  - ${configs}/visual_studio/visual_studio_config.windows.yaml

install:
  # downloading-rustup-windows:
  - download:
      src:
        url: https://rsproxy.cn/rustup/dist/x86_64-pc-windows-msvc/rustup-init.exe
      dest: ${download}/rustup-init.exe
  - copy:
      src: ${configs}/rustup/home/settings.toml
      dest: ${workspace}/rust/.rustup/settings.toml
  - copy:
      src: ${configs}/rustup/cargo/config.toml
      dest: ${workspace}/rust/.cargo/config.toml
  # install-rustup-windows:
  - copy:
      src: ${download}/rustup-init.exe
      dest: ${workspace}/rust/rustup-init.exe
  - environments:
      set:
        RUSTUP_HOME: ${workspace}/rust/.rustup
        CARGO_HOME: ${workspace}/rust/.cargo
        RUSTUP_DIST_SERVER: https://rsproxy.cn
        RUSTUP_UPDATE_ROOT: https://rsproxy.cn/rustup
  - execute:
      skip_if_exists: ${workspace}/rust/.cargo/bin/rustc.exe
      terminal: true
      command:
      - ${workspace}/rust/rustup-init.exe
      - -y
  - execute:
      command:
      - ${workspace}/rust/.cargo/bin/rustup.exe
      - default
      - stable-x86_64-pc-windows-msvc
  - execute:
      command:
      - ${workspace}/rust/.cargo/bin/rustup.exe
      - target
      - add
      - wasm32-wasip2
  - execute:
      terminal: true
      command:
        - ${workspace}/rust/.cargo/bin/cargo.exe
        - install
        - --locked
        - wasm-tools
        - wit-bindgen-cli
        - cargo-component
generator_active_batch:
  file_path: ${workspace}/rust/active.bat
  environments:
    set:
      RUSTUP_HOME: ${workspace}/rust/.rustup
      CARGO_HOME: ${workspace}/rust/.cargo
    prepend:
      - PATH: ${workspace}/rust/.cargo/bin
