sdk_root: ${workspace}/tracy

variables:
  tracy_version: "0.14.1"

install:
  # Since v0.14.0 Tracy publishes prebuilt macOS binaries (arm64), so the
  # profiler is consumed as a plain download: no source build, and neither
  # cmake nor an Apple toolchain dependency is needed anymore. The zip
  # carries the tracy-profiler.app bundle plus the command line utilities.
  - download:
      src:
        url: https://github.com/wolfpld/tracy/releases/download/v$var{tracy_version}/macos-$var{tracy_version}.zip
        SHA-256: 971e2d8a742a57dc081cb2e36cc6200d565be7555c39a2f6439f9d65e2b416cb
      dest: ${download}/tracy-$var{tracy_version}-macos.zip
  - unzip:
      src: ${download}/tracy-$var{tracy_version}-macos.zip
      dest: ${workspace}/tracy/tracy-client-$var{tracy_version}
  # Python's zipfile extraction does not restore the executable bits stored
  # in the archive, so set them explicitly.
  - make_execute_permission:
      files:
        - ${workspace}/tracy/tracy-client-$var{tracy_version}
generator_active_batch:
  file_path: ${workspace}/tracy/active.sh
  environments:
    set: {}
    prepend:
      - PATH: ${workspace}/tracy/tracy-client-$var{tracy_version}
