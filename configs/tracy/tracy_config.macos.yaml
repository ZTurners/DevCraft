dependencies:
  - cmake
  - xcode

install:
  # Tracy does not publish a prebuilt macOS client for v0.13.1, so build the
  # profiler client from the official tagged source archive.
  - download:
      src:
        url: https://github.com/wolfpld/tracy/archive/refs/tags/v0.13.1.tar.gz
        SHA-256: d4efc50ebcb0bfcfdbba148995aeb75044c0d80f5d91223aebfaa8fa9e563d2b
      dest: ${download}/tracy-0.13.1-source.tar.gz
  - unzip:
      src: ${download}/tracy-0.13.1-source.tar.gz
      src_sub_folder: tracy-0.13.1
      dest: ${workspace}/tracy/tracy-0.13.1-source
  - execute:
      skip_if_exists: ${workspace}/tracy/tracy-client-0.13.1/bin/tracy-profiler
      command:
        - ${workspace}/cmake/cmake-4.2.3-macos-universal/CMake.app/Contents/bin/cmake
        - -S ${workspace}/tracy/tracy-0.13.1-source/profiler
        - -B ${workspace}/tracy/tracy-0.13.1-source/profiler/build
        - -DCMAKE_BUILD_TYPE=Release
        - -DCMAKE_INSTALL_PREFIX=${workspace}/tracy/tracy-client-0.13.1
        - '&&'
        - ${workspace}/cmake/cmake-4.2.3-macos-universal/CMake.app/Contents/bin/cmake
        - --build ${workspace}/tracy/tracy-0.13.1-source/profiler/build
        - --config Release
        - --parallel
        - '&&'
        - ${workspace}/cmake/cmake-4.2.3-macos-universal/CMake.app/Contents/bin/cmake
        - --install ${workspace}/tracy/tracy-0.13.1-source/profiler/build
        - --config Release

generator_active_batch:
  file_path: ${workspace}/tracy/active.sh
  environments:
    set: {}
    prepend:
      - PATH: ${workspace}/tracy/tracy-client-0.13.1/bin
