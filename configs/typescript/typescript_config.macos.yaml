sdk_root: ${workspace}/typescript

dependencies:
  - nodejs

variables:
  typescript_version: "7.0.2"

install:
  # TypeScript 7.0.2 (latest npm release at configuration time)
  - execute:
      skip_if_exists: ${workspace}/typescript/bin/tsc
      command:
        - ${workspace}/nodejs/node-v$var{node_version}/bin/node
        - ${workspace}/nodejs/node-v$var{node_version}/lib/node_modules/npm/bin/npm-cli.js
        - install
        - --global
        - --prefix
        - ${workspace}/typescript
        - typescript@$var{typescript_version}

generator_active_batch:
  file_path: ${workspace}/typescript/active.sh
  environments:
    prepend:
      - PATH: ${workspace}/typescript/bin
