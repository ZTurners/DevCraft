sdk_root: ${workspace}/typescript

dependencies:
  - nodejs

variables:
  typescript_version: "7.0.2"

install:
  # TypeScript 7.0.2 (latest npm release at configuration time)
  - execute:
      skip_if_exists: ${workspace}/typescript/tsc.cmd
      command:
        - '"%NODE_HOME%/npm.cmd"'
        - install
        - --global
        - --prefix
        - ${workspace}/typescript
        - typescript@$var{typescript_version}

generator_active_batch:
  file_path: ${workspace}/typescript/active.bat
  environments:
    prepend:
      - PATH: ${workspace}/typescript
