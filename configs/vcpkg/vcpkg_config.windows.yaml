sdk_root: ${workspace}/vcpkg

variables:
  vcpkg_version: "2026.04.27"

install:
  # vcpkg source from GitHub Releases tag archive
  - download:
      src:
        url: https://github.com/microsoft/vcpkg/archive/refs/tags/$var{vcpkg_version}.zip
      dest: ${download}/vcpkg-$var{vcpkg_version}.zip
  - unzip:
      src: ${download}/vcpkg-$var{vcpkg_version}.zip
      src_sub_folder: vcpkg-$var{vcpkg_version}
      dest: ${workspace}/vcpkg

  # bootstrap vcpkg.exe
  - execute:
      skip_if_exists: ${workspace}/vcpkg/vcpkg.exe
      command:
        - ${workspace}/vcpkg/bootstrap-vcpkg.bat

generator_active_batch:
  file_path: ${workspace}/vcpkg/active.bat
  environments:
    set:
      VCPKG_ROOT: ${workspace}/vcpkg
      VCPKG_DOWNLOADS: ${workspace}/vcpkg/downloads
    prepend:
      - PATH: ${workspace}/vcpkg
