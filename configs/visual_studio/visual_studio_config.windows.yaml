sdk_root: ${workspace}/visual_studio

variables:
  msvc_major_version: "14.52"
  windows_sdk_package_version: "10.0.26100.7705"
  windows_sdk_version: "10.0.26100.0"

install:
  # Install a repo-local portable MSVC + Windows SDK toolchain.
  # --msvc-version takes a major.minor prefix only: the patch version is decided
  # by the feed, and the actually installed full version is read back from
  # portable_msvc.json by the set_variables step below, so every generated path
  # matches disk by construction (no hardcoded patch version to drift).
  # To list what the feed currently serves (prefix=fullversion pairs):
  #   python configs/visual_studio/scripts/portable_msvc_install.py --show-versions --vs=2026 --insiders
  # NOTE: 14.52 currently ships only in the VS 2026 Insiders feed; the '_mm_fmsub_sd'
  # constexpr fix (microsoft/STL PR #6137) needs it for clang-cl >= 22. Drop --insiders
  # once 14.52 (or newer) reaches the stable channel.
  - execute:
      terminal: true
      command:
        - python
        - ${configs}/visual_studio/scripts/portable_msvc_install.py
        - --accept-license
        - --downloads=${download}/portable_msvc
        - --host=x64
        - --target=x64
        - --target=arm64

        - --vs=2026
        - --insiders
        - --msvc-version=$var{msvc_major_version}
        - --msvc-output=${workspace}/visual_studio

        - --windows-sdk-version=$var{windows_sdk_package_version}
        - --windows-sdk-output=${workspace}/visual_studio

        - --skip-if-output-folder-exists=true

      dest: ${workspace}/visual_studio/msvc
  # The install script writes the actually installed toolset version to
  # portable_msvc.json (full version as msvc_version, patch part as
  # msvc_minor_version); read both back so generator_active_batch (interpolated
  # after install steps) and dependent configs use the real on-disk version.
  - set_variables:
      msvc_version:
        json_file: ${workspace}/visual_studio/portable_msvc.json
        json_key: msvc_version
      msvc_minor_version:
        json_file: ${workspace}/visual_studio/portable_msvc.json
        json_key: msvc_minor_version

generator_active_batch:
  file_path: ${workspace}/visual_studio/active.bat
  environments:
    set:
      MSVC_VERSION: $var{msvc_version}
      MSVC_MAJOR_VERSION: $var{msvc_major_version}
      MSVC_MINOR_VERSION: $var{msvc_minor_version}
      MSVC_14_52_MINOR_VERSION: $var{msvc_minor_version}
      VCToolsVersion: $var{msvc_version}
      VCToolsInstallDir: ${workspace}/visual_studio/VC/Tools/MSVC/$var{msvc_version}
      WindowsSDKVersion: $var{windows_sdk_version}\
      INCLUDE: ${workspace}/visual_studio/VC/Tools/MSVC/$var{msvc_version}/include;${workspace}/visual_studio/WindowsKits/10/Include/$var{windows_sdk_version}/ucrt;${workspace}/visual_studio/WindowsKits/10/Include/$var{windows_sdk_version}/shared;${workspace}/visual_studio/WindowsKits/10/Include/$var{windows_sdk_version}/um;${workspace}/visual_studio/WindowsKits/10/Include/$var{windows_sdk_version}/winrt;${workspace}/visual_studio/WindowsKits/10/Include/$var{windows_sdk_version}/cppwinrt
      LIB: ${workspace}/visual_studio/VC/Tools/MSVC/$var{msvc_version}/lib/x64;${workspace}/visual_studio/WindowsKits/10/Lib/$var{windows_sdk_version}/ucrt/x64;${workspace}/visual_studio/WindowsKits/10/Lib/$var{windows_sdk_version}/um/x64
      DEVCRAFT_VISUAL_STUDIO_MAJOR_VERSION: "18"
      DEVCRAFT_PORTABLE_MSVC_ROOT: ${workspace}/visual_studio
      DEVCRAFT_PORTABLE_MSVC_SETUP_X64: ${workspace}/visual_studio/setup_x64.bat
    prepend:
      - PATH: ${workspace}/visual_studio/VC/Tools/MSVC/$var{msvc_version}/bin/Hostx64/x64
      - PATH: ${workspace}/visual_studio/WindowsKits/10/bin/$var{windows_sdk_version}/x64
      - PATH: ${workspace}/visual_studio/WindowsKits/10/bin/$var{windows_sdk_version}/x64/ucrt

