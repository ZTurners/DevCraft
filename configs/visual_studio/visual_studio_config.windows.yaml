install:
  # Install a repo-local portable MSVC + Windows SDK toolchain.
  # --msvc-version accepts a full toolset version (14.51.36014) or a major.minor prefix (14.51).
  # To list available toolset and SDK versions run:
  #   python configs/visual_studio/scripts/portable_msvc_install.py --show-versions
  - execute:
      command:
        - python
        - ${configs}/visual_studio/scripts/portable_msvc_install.py
        - --accept-license
        - --downloads=${download}/portable_msvc
        - --host=x64
        - --target=x64
        - --target=arm64

        - --msvc-version=14.51.36014
        - --msvc-output=${workspace}/visual_studio

        - --windows-sdk-version=10.0.26100.7705
        - --windows-sdk-output=${workspace}/visual_studio

        - --skip-if-output-folder-exists=true

      dest: ${workspace}/visual_studio/msvc
  - environments:
      set:
        VCToolsInstallDir: ${workspace}/visual_studio/VC/Tools/MSVC/14.51.36014
        WindowsSDKVersion: 10.0.26100.0\
        INCLUDE: ${workspace}/visual_studio/VC/Tools/MSVC/14.51.36014/include;${workspace}/visual_studio/WindowsKits/10/Include/10.0.26100.0/ucrt;${workspace}/visual_studio/WindowsKits/10/Include/10.0.26100.0/shared;${workspace}/visual_studio/WindowsKits/10/Include/10.0.26100.0/um;${workspace}/visual_studio/WindowsKits/10/Include/10.0.26100.0/winrt;${workspace}/visual_studio/WindowsKits/10/Include/10.0.26100.0/cppwinrt
        LIB: ${workspace}/visual_studio/VC/Tools/MSVC/14.51.36014/lib/x64;${workspace}/visual_studio/WindowsKits/10/Lib/10.0.26100.0/ucrt/x64;${workspace}/visual_studio/WindowsKits/10/Lib/10.0.26100.0/um/x64
      prepend:
        - PATH: ${workspace}/visual_studio/VC/Tools/MSVC/14.51.36014/bin/Hostx64/x64
        - PATH: ${workspace}/visual_studio/WindowsKits/10/bin/10.0.26100.0/x64
        - PATH: ${workspace}/visual_studio/WindowsKits/10/bin/10.0.26100.0/x64/ucrt

generator_active_batch:
  file_path: ${workspace}/visual_studio/active
  environments:
    set:
      DEVCRAFT_VISUAL_STUDIO_MAJOR_VERSION: 18
      DEVCRAFT_PORTABLE_MSVC_ROOT: ${workspace}/visual_studio
      DEVCRAFT_PORTABLE_MSVC_SETUP_X64: ${workspace}/visual_studio/setup_x64.bat
