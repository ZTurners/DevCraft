sdk_root: ${workspace}/vulkan

variables:
  vulkan_version: "1.4.328.1"

install:
  # vulkansdk-macos-x64-1.4.328:
  - download:
      src:
        url: https://sdk.lunarg.com/sdk/download/$var{vulkan_version}/mac/vulkansdk-macos-$var{vulkan_version}.zip
        SHA-256: 571db867d8736e402f6f674f26f17b339495d016f3b2afdbac23a3650475023f
      dest: ${download}/vulkansdk-macos-$var{vulkan_version}.zip
  # force-clean the scratch dir first: the Qt-installer-framework binary
  # refuses a target directory that already contains an installation, so
  # leftovers in .tmp from an interrupted run would fail the reinstall
  - execute:
      command:
        - rm
        - -rf
        - ${workspace}/.tmp/vulkan
  - unzip:
      src: ${download}/vulkansdk-macos-$var{vulkan_version}.zip
      dest: ${workspace}/.tmp/vulkan
  - make_execute_permission:
      files:
        - ${workspace}/.tmp/vulkan/vulkansdk-macos-$var{vulkan_version}.app/Contents/MacOS/vulkansdk-macos-$var{vulkan_version}
  - execute:
      command:
        - ${workspace}/.tmp/vulkan/vulkansdk-macos-$var{vulkan_version}.app/Contents/MacOS/vulkansdk-macos-$var{vulkan_version}
        - install
        - --accept-licenses
        - --confirm-command
        - copy_only=1
        - --root=${workspace}/.tmp/vulkan/vulkansdk_macos_x86_64_$var{vulkan_version}
      dest: ${workspace}/vulkan/vulkansdk_macos_x86_64_$var{vulkan_version}
  - copy:
      src: ${workspace}/.tmp/vulkan/vulkansdk_macos_x86_64_$var{vulkan_version}/macOS
      dest: ${workspace}/vulkan/vulkansdk_macos_x86_64_$var{vulkan_version}
  # vulkansdk-linux-x86_64-1.4.328.1:
  - download:
      src:
        url: https://sdk.lunarg.com/sdk/download/$var{vulkan_version}/linux/vulkansdk-linux-x86_64-$var{vulkan_version}.tar.xz
      dest: ${download}/vulkansdk-linux-x86_64_$var{vulkan_version}.tar.xz
  - unzip:
      src: ${download}/vulkansdk-linux-x86_64-$var{vulkan_version}.tar.xz
      src_sub_folder: $var{vulkan_version}/x86_64
      dest: ${workspace}/vulkan/vulkansdk_linux_x86_64_$var{vulkan_version}
generator_active_batch:
  file_path: ${workspace}/vulkan/active.sh
  environments:
    set:
      VK_ICD_FILENAMES: ${workspace}/vulkan/vulkansdk_macos_x86_64_$var{vulkan_version}/share/vulkan/icd.d/MoltenVK_icd.json
      VK_LAYER_PATH: ${workspace}/vulkan/vulkansdk_macos_x86_64_$var{vulkan_version}/bin
      VK_BIN_PATH: ${workspace}/vulkan/vulkansdk_macos_x86_64_$var{vulkan_version}/bin
    prepend:
      - PATH: ${workspace}/vulkan/vulkansdk_macos_x86_64_$var{vulkan_version}/bin
