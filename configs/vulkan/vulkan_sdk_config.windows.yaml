sdk_root: ${workspace}/vulkan

variables:
  vulkan_version: "1.4.328.1"

install:
  # vulkansdk-win-x64-1.4.328.1:
  - download:
      src:
        url: https://sdk.lunarg.com/sdk/download/$var{vulkan_version}/windows/vulkansdk-windows-X64-$var{vulkan_version}.exe
        SHA-256: a8675df6d538079c2a719a9373994948091db785b48f142e024254e76348d16c
      dest: ${download}/vulkansdk-windows-X64-$var{vulkan_version}.exe
  - execute:
      command:
        - ${download}/vulkansdk-windows-X64-$var{vulkan_version}.exe
        - install
        - --accept-licenses
        - --confirm-command
        - copy_only=1
        - --root=${workspace}/vulkan/vulkansdk_win_x86_64_$var{vulkan_version}
      dest: ${workspace}/vulkan/vulkansdk_win_x86_64_$var{vulkan_version}
  # vulkansdk-linux-x86_64-1.4.328.1:
  - download:
      src:
        url: https://sdk.lunarg.com/sdk/download/$var{vulkan_version}/linux/vulkansdk-linux-x86_64-$var{vulkan_version}.tar.xz
        SHA-256: 241e75b56c91c0d210ed07a7c638ec05a3e5b0e4c66ba9f0ba0f102d823ad6bf
      dest: ${download}/vulkansdk-linux-x86_64-$var{vulkan_version}.tar.xz
  - unzip:
      src: ${download}/vulkansdk-linux-x86_64-$var{vulkan_version}.tar.xz
      src_sub_folder: $var{vulkan_version}/x86_64
      dest: ${workspace}/vulkan/vulkansdk_linux_x86_64_$var{vulkan_version}
      output_symbol_list: ${workspace}/vulkan/vulkansdk_linux_x86_64_$var{vulkan_version}/.symbol_links.json
  - resolve_symlinks:
      src: ${workspace}/vulkan/vulkansdk_linux_x86_64_$var{vulkan_version}
      symbol_list: ${workspace}/vulkan/vulkansdk_linux_x86_64_$var{vulkan_version}/.symbol_links.json

generator_active_batch:
  file_path: ${workspace}/vulkan/active.bat
  environments:
    set:
      VK_LAYER_PATH: ${workspace}/vulkan/vulkansdk_win_x86_64_$var{vulkan_version}/Bin
      VK_BIN_PATH: ${workspace}/vulkan/vulkansdk_win_x86_64_$var{vulkan_version}/Bin
    prepend:
      - PATH: ${workspace}/vulkan/vulkansdk_win_x86_64_$var{vulkan_version}/Bin
