install:
  # Detect SDK version from an already-installed Windows SDK
  - execute:
      command:
        - python
        - ${configs}/win_sdk/scripts/win_sdk_version_detect.py
        - --version-check 10.0.26100.0
        - --info-output-file ${workspace}/win_sdk/info.json

generator_active_batch:
  file_path: ${workspace}/win_sdk/active
  environments:
    set:
      DEVCRAFT_WINDOWS_SDK_VERSION: 10.0.26100.0