install:
  # Download Windows SDK via NuGet for workspace installation
  - download:
      src:
        url: https://globalcdn.nuget.org/packages/microsoft.windows.sdk.cpp.10.0.26100.7705.nupkg
      dest: ${download}/windows-sdk-10.0.26100.7705.nupkg
  
  # Copy .nupkg to .zip (NuGet packages are zip files)
  - copy:
      src: ${download}/windows-sdk-10.0.26100.7705.nupkg
      dest: ${download}/windows-sdk-10.0.26100.7705.zip
  
  # Extract to workspace
  - unzip:
      src: ${download}/windows-sdk-10.0.26100.7705.zip
      src_sub_folder: ""
      dest: ${workspace}/win_sdk/sdk

generator_active_batch:
  file_path: ${workspace}/win_sdk/active
  environments:
    set:
      DEVCRAFT_WINDOWS_SDK_VERSION: 10.0.26100.7705
      WindowsSdkDir: ${workspace}/win_sdk/sdk/c
      WindowsSDKVersion: 10.0.26100.7705
    prepend:
      - PATH: ${workspace}/win_sdk/sdk/c/bin/10.0.26100.0/x64
      - PATH: ${workspace}/win_sdk/sdk/c/bin/10.0.26100.0/x86