install:
  #cmake-3.31:
  - download:
      src:
        url: https://github.com/Kitware/CMake/releases/download/v4.2.3/cmake-4.2.3-windows-x86_64.zip
        SHA-256: eb4ebf5155dbb05436d675706b2a08189430df58904257ae5e91bcba4c86933c
      dest: ${download}/cmake-4.2.3-windows-x86_64.zip
  - unzip:
      src: ${download}/cmake-4.2.3-windows-x86_64.zip
      src_sub_folder: cmake-4.2.3-windows-x86_64
      dest: ${workspace}/cmake/cmake-4.2.3
generator_active_batch:
  file_path: ${workspace}/cmake/active
  environments:
    set: {}
    prepend:
      - PATH: ${workspace}/cmake/cmake-4.2.3/bin
