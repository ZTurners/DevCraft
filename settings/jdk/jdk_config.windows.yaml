install:
  # jdk-25:
  - download:
      src:
        url: https://download.oracle.com/java/25/archive/jdk-25.0.1_windows-x64_bin.zip
        SHA-256: 814530b8ae9aca4843b6f70cf14dac1d43a88e220847d3b91323e854d79cee88
      dest: ${download}/jdk-25.0.1_windows-x64_bin.zip
  - unzip:
      src: ${download}/jdk-25.0.1_windows-x64_bin.zip
      src_sub_folder: jdk-25.0.1
      dest: ${workspace}/jdk/jdk-25
  # set environment variable for android_sdk install during installation, and also for user to use after installation
  - environments:
      set:
        JAVA_HOME: ${workspace}/jdk/jdk-25
        JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8
      prepend:
        - PATH: ${workspace}/jdk/jdk-25/bin
generator_active_batch:
  file_path: ${workspace}/jdk/active
  environments:
    set:
      JAVA_HOME: ${workspace}/jdk/jdk-25
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8
    prepend:
      - PATH: ${workspace}/jdk/jdk-25/bin
