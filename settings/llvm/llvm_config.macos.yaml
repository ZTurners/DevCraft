install:
  # llvm-21:
  # - execute:
  #     command:
  #       - brew install llvm@21 &&
  #       - mkdir -p ${workspace}/llvm &&
  #       - ln -sf $(brew --prefix llvm@21) ${workspace}/llvm/llvm-21
  # # lld-21:
  # - execute:
  #     command:
  #       - brew install lld@21 &&
  #       - mkdir -p ${workspace}/llvm &&
  #       - ln -sf $(brew --prefix lld@21) ${workspace}/llvm/lld-21
  
  # llvm for macos arm64
  - download:
      src:
        url: https://github.com/llvm/llvm-project/releases/download/llvmorg-21.1.6/LLVM-21.1.6-macOS-ARM64.tar.xz
        SHA-256: bdf036e9987b8706471b565f50178a34218909b1858a82c426269da49780b6ba
      dest: ${download}/LLVM-21.1.6-macOS-ARM64.tar.xz
  - unzip:
      src: ${download}/LLVM-21.1.6-macOS-ARM64.tar.xz
      src_sub_folder: LLVM-21.1.6-macOS-ARM64
      dest: ${workspace}/llvm/llvm-21/arm64-apple-darwin

  # llvm for linux arm64
  - download:
      src:
        url: https://github.com/llvm/llvm-project/releases/download/llvmorg-21.1.6/LLVM-21.1.6-Linux-ARM64.tar.xz
        SHA-256: 1d8a9e05007b8b9005c63f90d7646b2b6263451d605cca070418d0a71e669377
      dest: ${download}/LLVM-21.1.6-Linux-ARM64.tar.xz
  - unzip:
      src: ${download}/LLVM-21.1.6-Linux-ARM64.tar.xz
      src_sub_folder: LLVM-21.1.6-Linux-ARM64
      dest: ${workspace}/llvm/llvm-21/aarch64-linux-gnu

  # llvm for linux x86_64
  - download:
      src:
        url: https://github.com/llvm/llvm-project/releases/download/llvmorg-21.1.6/LLVM-21.1.6-Linux-X64.tar.xz
        SHA-256: 8ac1aadfa96b87b8747f7383d06ed9579f9d5c32a1af7af947b0cfe29d88ac87
      dest: ${download}/LLVM-21.1.6-Linux-X64.tar.xz
  - unzip:
      src: ${download}/LLVM-21.1.6-Linux-X64.tar.xz
      src_sub_folder: LLVM-21.1.6-Linux-X64
      dest: ${workspace}/llvm/llvm-21/x86_64-linux-gnu
generator_active_batch:
  file_path: ${workspace}/llvm/active
  environments:
    # set:
    #   HOST_LLVM_BIN: ${workspace}/llvm/llvm-21/arm64-apple-darwin/bin
    prepend:
      - PATH: ${workspace}/llvm/llvm-21/arm64-apple-darwin/bin
      - PATH: ${workspace}/llvm/lld-21/arm64-apple-darwin/bin
