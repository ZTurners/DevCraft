install:
  # llvm for windows
  - download:
      src:
        url: https://github.com/llvm/llvm-project/releases/download/llvmorg-21.1.6/clang+llvm-21.1.6-x86_64-pc-windows-msvc.tar.xz
        SHA-256: 6fd57e4461f4f30913c6a345dd093d71df963aaf94f1ec80bb5cfb24ebb047a1
      dest: ${download}/clang+llvm-21.1.6-x86_64-pc-windows-msvc.tar.xz
  - unzip:
      src: ${download}/clang+llvm-21.1.6-x86_64-pc-windows-msvc.tar.xz
      src_sub_folder: clang+llvm-21.1.6-x86_64-pc-windows-msvc
      dest: ${workspace}/llvm/llvm-21/x86_64-windows-msvc
  
  # install python 310 for llvm on windows
  - download:
      src:
        url: https://www.python.org/ftp/python/3.10.10/python-3.10.10-embed-amd64.zip
      dest: ${download}/python-3.10.10-embed-amd64.zip
  - unzip:
      src: ${download}/python-3.10.10-embed-amd64.zip
      dest: ${workspace}/python/versions/3.10.10
  - copy:
      src: ${workspace}/python/versions/3.10.10
      dest: ${workspace}/llvm/llvm-21/x86_64-windows-msvc/bin
      force_update: true

  # llvm for linux arm64
  - download:
      src:
        url: https://github.com/llvm/llvm-project/releases/download/llvmorg-21.1.6/LLVM-21.1.6-Linux-ARM64.tar.xz
        SHA-256: 1d8a9e05007b8b9005c63f90d7646b2b6263451d605cca070418d0a71e669377
      dest: ${download}/LLVM-21.1.6-Linux-ARM64.tar.xz
  - unzip:
      src: ${download}/LLVM-21.1.6-Linux-ARM64.tar.xz
      src_sub_folder: LLVM-21.1.6-Linux-ARM64
      dest: ${workspace}/llvm/llvm-21/aarch64-linux-gnu
  # Unknown why the libc++.so is a broken symlink to libc++.so.1 which is missing, so we need to copy it manually from libc++.so.1.0
  - copy:
      src: ${workspace}/llvm/llvm-21/aarch64-linux-gnu/lib/aarch64-unknown-linux-gnu/libc++.so.1.0
      dest: ${workspace}/llvm/llvm-21/aarch64-linux-gnu/lib/aarch64-unknown-linux-gnu/libc++.so.1
      force_update: true

  # llvm for linux x86_64
  - download:
      src:
        url: https://github.com/llvm/llvm-project/releases/download/llvmorg-21.1.6/LLVM-21.1.6-Linux-X64.tar.xz
        SHA-256: 8ac1aadfa96b87b8747f7383d06ed9579f9d5c32a1af7af947b0cfe29d88ac87
      dest: ${download}/LLVM-21.1.6-Linux-X64.tar.xz
  - unzip:
      src: ${download}/LLVM-21.1.6-Linux-X64.tar.xz
      src_sub_folder: LLVM-21.1.6-Linux-X64
      dest: ${workspace}/llvm/llvm-21/x86_64-linux-gnu

generator_active_batch:
  file_path: ${workspace}/llvm/active
  environments:
    # set:
    #   HOST_LLVM_BIN: ${workspace}/llvm/llvm-21/x86_64-windows-msvc/bin
    prepend:
      - PATH: ${workspace}/llvm/llvm-21/x86_64-windows-msvc/bin
