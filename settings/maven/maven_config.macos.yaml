install:
  - download:
      src:
        url: https://dlcdn.apache.org/maven/maven-3/3.9.11/binaries/apache-maven-3.9.11-bin.zip
        SHA-256: 0d7125e8c91097b36edb990ea5934e6c68b4440eef4ea96510a0f6815e7eeadb
      dest: ${download}/apache-maven-3.9.11-bin.zip
  - unzip:
      src: ${download}/apache-maven-3.9.11-bin.zip
      src_sub_folder: apache-maven-3.9.11
      dest: ${workspace}/maven/maven-3.9.11
  - change_file_content:
      file_path: ${workspace}/maven/maven-3.9.11/conf/settings.xml
      change:
      - line: 55
        content: '  <localRepository>${workspace}/maven/.m2/repository</localRepository>'
generator_active_batch:
  file_path: ${workspace}/maven/active
  environments:
    set:
      MAVEN_HOME: ${workspace}/maven/.m2
    prepend:
      - PATH: ${workspace}/maven/maven-3.9.11/bin
