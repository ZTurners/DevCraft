install:
  # Download vswhere.exe
  - download:
      src:
        url: https://github.com/microsoft/vswhere/releases/latest/download/vswhere.exe
      dest: ${download}/vswhere.exe

  - execute:
      command:
        - python
        - ${settings}/visual_studio/scripts/visual_studio_version_detect.py
        - --vswhere ${download}/vswhere.exe
        - --version-check 18.3.x.x
        - --info-output-file ${workspace}/visual_studio/info.json

generator_active_batch:
  file_path: ${workspace}/visual_studio/active
  environments:
    set:
      DEVCRAFT_VISUAL_STUDIO_MAJOR_VERSION: 18
