install:
  # wasmtime
  - download:
      src:
        url: https://github.com/bytecodealliance/wasmtime/releases/download/v40.0.1/wasmtime-v40.0.1-aarch64-macos.tar.xz
        SHA-256: 08fb87c00f6caa9c0630d0ce3ff5e31ee3df9b37fcd7878222825881ef933a91
      dest: ${download}/wasmtime-v40.0.1-aarch64-macos.tar.xz
  - unzip:
      src: ${download}/wasmtime-v40.0.1-aarch64-macos.tar.xz
      src_sub_folder: 'wasmtime-v40.0.1-aarch64-macos'
      dest: ${workspace}/wasm/wasmtime-v40.0.1-aarch64-macos

  # wabt wasm assemble binaires tools
  - download:
      src:
        url: https://github.com/WebAssembly/wabt/releases/download/1.0.39/wabt-1.0.39-macos-arm64.tar.gz
        SHA-256: 168a83f22125a77d96ecb230341ed0e2b06b970aadb57eb89d2ed06f9b7f8aca
      dest: ${download}/wabt-1.0.39-macos-arm64
  - unzip:
      src: ${download}/wabt-1.0.39-macos-arm64
      src_sub_folder: wabt-1.0.39
      dest: ${workspace}/wasm/wabt-1.0.39-macos-arm64

  # wasi sdk
  - download:
      src:
        url: https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-29/wasi-sdk-29.0-arm64-macos.tar.gz
        SHA-256: e11552913e3f99e834d7fe7da1bd081abaf764759ed76b6097a34c63fc83665e
      dest: ${download}/wasi-sdk-29.0-arm64-macos.tar.gz
  - unzip:
      src: ${download}/wasi-sdk-29.0-arm64-macos.tar.gz
      src_sub_folder: wasi-sdk-29.0-arm64-macos
      dest: ${workspace}/wasm/wasi-sdk-29.0-arm64-macos

generator_active_batch:
  file_path: ${workspace}/wasm/active
  environments:
    prepend:
      - PATH: ${workspace}/wasm/wasmtime-v40.0.1-aarch64-macos
    set:
      WASI_SDK_PATH: ${workspace}/wasm/wasi-sdk-29.0-arm64-macos
      WASI_SYSROOT: ${workspace}/wasm/wasi-sdk-29.0-arm64-macos/share/wasi-sysroot
