install:
  # wasmtime
  - download:
      src:
        url: https://github.com/bytecodealliance/wasmtime/releases/download/v38.0.4/wasmtime-v38.0.4-x86_64-windows.zip
        SHA-256: 5a30c7a78f48a1caa2afb1dd541493fd8af5f629ea45097b04f2412e651285b6
      dest: ${download}/wasmtime-v38.0.4-x86_64-windows.zip
  - unzip:
      src: ${download}/wasmtime-v38.0.4-x86_64-windows.zip
      src_sub_folder: 'wasmtime-v38.0.4-x86_64-windows'
      dest: ${workspace}/wasm/wasmtime-v38.0.4-x86_64-windows

  # wasi sdk
  - download:
      src:
        url: https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-29/wasi-sdk-29.0-x86_64-windows.tar.gz
        SHA-256: 6c19b820577486f00332ad8d04ac506da67b0892316b8d485371a58cbf216dee
      dest: ${download}/wasi-sdk-29.0-x86_64-windows.tar.gz
  - unzip:
      src: ${download}/wasi-sdk-29.0-x86_64-windows.tar.gz
      src_sub_folder: wasi-sdk-29.0-x86_64-windows
      dest: ${workspace}/wasm/wasi-sdk-29.0-x86_64-windows
  
  # wasi root system
  - download:
      src:
        url: https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-29/wasi-sysroot-29.0.tar.gz
        SHA-256: d99d5c4b277a725b7b56bf9d591609972ecac3207520a66408927280f191f6c7
      dest: ${download}wasi-sysroot-29.0.tar.gz
  - unzip:
      src: ${download}wasi-sysroot-29.0.tar.gz
      src_sub_folder: wasi-sysroot-29.0
      dest: ${workspace}/wasm/wasi-sysroot-29.0

generator_active_batch:
  file_path: ${workspace}/wasm/active
  environments:
    set:
      WASI_SDK_PATH: ${workspace}/wasm/wasi-sdk-29.0-x86_64-windows
      WASI_SYSROOT: ${workspace}/wasm/wasi-sysroot-29.0


